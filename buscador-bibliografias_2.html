<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliografías · Bibliotecas Duoc UC</title>
<meta name="description" content="Encuentra la bibliografía de tu asignatura: elige escuela, carrera y asignatura, o busca por código o nombre. Bibliotecas Duoc UC.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   TOKENS
   ══════════════════════════════════════════════════ */
:root{
  --paper:#FFFFFF;
  --ink:#101010;
  --ink-soft:#4C4C4C;
  --ink-mute:#7A7A7A;
  --rule:#E2E2E2;
  --rule-soft:#EFEFEF;
  --wash:#FBFBF9;
  --amber:#F5A800;
  --amber-wash:#FFF7E3;
  --amber-deep:#8A6410;
  --navy:#002147;
  --sans:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:var(--sans);
  --r:4px;
  --col:940px;
  --pad:clamp(18px,5vw,28px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.025em;line-height:1.1}
p{margin:0}
a{color:var(--navy);text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2.5px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:2px}
.col{max-width:var(--col);margin:0 auto;padding:0 var(--pad)}
.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ══════════════════════════════════════════════════
   BARRA SUPERIOR
   ══════════════════════════════════════════════════ */
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.bannerlink{display:block}
.bannerlink:hover{text-decoration:none}
.banner{display:block;width:100%;max-width:var(--col);margin:0 auto;height:auto;max-height:132px;object-fit:contain}
@media (max-width:620px){.banner{max-height:74px}}

/* ══════════════════════════════════════════════════
   BUSCADOR (hero → anclado)
   ══════════════════════════════════════════════════ */
.finder{background:var(--paper);border-bottom:1px solid var(--rule)}
body.inside .finder{position:sticky;top:0;z-index:40}
.finder-in{padding:clamp(52px,10vw,92px) var(--pad) clamp(34px,6vw,54px)}
body.inside .finder-in{padding:12px var(--pad)}

.hero{max-width:var(--col);margin:0 auto}
body.inside .hero-copy{display:none}
.hero-copy h1{font-size:clamp(31px,5.6vw,50px);max-width:16em}
.hero-copy h1 em{font-style:normal;box-shadow:inset 0 -.3em 0 var(--amber-wash)}
.hero-copy .lead{margin-top:16px;max-width:44em;color:var(--ink-soft);font-size:clamp(15px,1.7vw,17.5px)}

.searchbox{position:relative;max-width:var(--col);margin:26px auto 0}
body.inside .searchbox{margin:0 auto}
.searchbox svg.glass{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-mute);pointer-events:none}
#q{
  width:100%;height:54px;padding:0 46px;border:1.5px solid var(--ink);border-radius:var(--r);
  background:var(--paper);color:var(--ink);font:400 16.5px var(--sans)
}
body.inside #q{height:42px;font-size:15px;border-color:var(--rule)}
body.inside #q:hover{border-color:#c7c7c7}
#q::placeholder{color:#9c9c9c}
#q:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-wash)}
#q::-webkit-search-cancel-button{display:none}
.clearq{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:none;border-radius:var(--r);color:var(--ink-mute);display:none}
body.has-q .clearq{display:block}
.clearq:hover{background:var(--rule-soft);color:var(--ink)}

/* ══════════════════════════════════════════════════
   PASOS (breadcrumb + progreso)
   ══════════════════════════════════════════════════ */
.steps{border-bottom:1px solid var(--rule);background:var(--wash);display:none}
body.inside .steps{display:block;position:sticky;top:67px;z-index:39}
.steps-in{display:flex;align-items:stretch;max-width:var(--col);margin:0 auto;overflow-x:auto;scrollbar-width:none}
.steps-in::-webkit-scrollbar{display:none}
.back{
  display:flex;align-items:center;gap:7px;flex:none;align-self:center;
  background:var(--paper);border:1px solid var(--ink);border-radius:var(--r);
  padding:6px 12px;margin-right:16px;font-size:13px;font-weight:700;color:var(--ink)
}
.back:hover{background:var(--ink);color:#fff}
.back svg{width:13px;height:13px;flex:none}
.step{
  display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:11px 16px 11px 0;text-align:left;min-width:0;flex:0 1 auto;color:var(--ink-mute)
}
.step+.step{padding-left:16px;border-left:1px solid var(--rule)}
.step .num{
  width:19px;height:19px;flex:none;border-radius:50%;border:1.5px solid var(--rule);
  font:700 10px/17px var(--sans);text-align:center;color:var(--ink-mute)
}
.step .lbl{min-width:0}
.step .k{display:block;font:700 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}
.step .v{display:block;font-size:13px;font-weight:700;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.step.done{color:var(--ink)}
.step.done .v{color:var(--navy)}
.step.done:hover .v{text-decoration:underline;text-underline-offset:2.5px}
.step.done .num{border-color:var(--ink);color:var(--ink)}
.step.now{cursor:default}
.step.now .num{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:500}
.step.now .v,.step.now .k{color:var(--ink)}
.step:disabled{cursor:default}
@media (max-width:760px){
  /* en pantallas angostas la ruta completa no cabe: queda solo Volver */
  .step{display:none}
  .back{margin-right:0}
  .steps-in{padding:8px var(--pad)}
}

/* ══════════════════════════════════════════════════
   CONTENIDO
   ══════════════════════════════════════════════════ */
main{padding:0 0 90px}
.head{max-width:var(--col);margin:0 auto;padding:clamp(26px,5vw,42px) var(--pad) 0}
.head .eyebrow{display:block;margin-bottom:9px}
.head h2{font-size:clamp(24px,3.5vw,34px);max-width:26em}
.head .sub{margin-top:9px;color:var(--ink-soft);font-size:14.5px}
.head .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font:400 11.5px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 7px;color:var(--ink-soft)}
.pill b{font-weight:500;color:var(--ink)}

.tools{max-width:var(--col);margin:22px auto 0;padding:0 var(--pad);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sift{position:relative;flex:1 1 260px;max-width:360px}
.sift input{
  width:100%;height:36px;padding:0 12px 0 32px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--paper);font:400 13.5px var(--sans)
}
.sift input:focus{outline:none;border-color:var(--ink)}
.sift svg{position:absolute;left:10px;top:10px;width:15px;height:15px;color:var(--ink-mute)}
.planbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plan-chip{
  background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;
  font:400 11.5px var(--mono);color:var(--ink-soft)
}
.plan-chip:hover{border-color:var(--ink);color:var(--ink)}
.plan-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* escuelas en cuadros */
.grid{
  max-width:var(--col);margin:20px auto 0;padding:0 var(--pad);
  display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))
}
.tile{
  display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--amber);
  border-radius:var(--r);padding:20px 16px;min-height:82px;
  transition:border-color .14s,box-shadow .14s,transform .14s
}
.tile:hover,.tile:focus-visible{border-color:var(--ink);border-left-color:var(--amber);transform:translateY(-1px);box-shadow:0 10px 24px -20px rgba(0,0,0,.5)}
.tile .n{flex:1 1 auto;font-size:16.5px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.tile .ico{
  width:38px;height:38px;flex:none;border-radius:8px;background:var(--amber-wash);
  display:flex;align-items:center;justify-content:center;color:var(--amber-deep);
  transition:background .14s,color .14s
}
.tile .ico svg{width:20px;height:20px;display:block}
.tile:hover .ico{background:var(--amber);color:var(--ink)}
.tile .chev{width:15px;height:15px;flex:none;color:var(--rule);transition:color .14s,transform .14s}
.tile:hover .chev{color:var(--ink);transform:translateX(2px)}

/* filas navegables */
.rows{max-width:var(--col);margin:18px auto 0;padding:0 var(--pad);border-top:1px solid var(--rule)}
.row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0 18px;
  width:100%;background:none;border:none;border-bottom:1px solid var(--rule-soft);
  border-left:3px solid transparent;padding:15px 4px 15px 13px;text-align:left;
  transition:background .13s,border-color .13s
}
.row:hover,.row:focus-visible{background:#FCFBF7;border-left-color:var(--amber)}
.row .lead-cell{font:700 12px var(--sans);letter-spacing:.04em;color:var(--amber-deep);background:var(--amber-wash);border:1px solid #F0E1BC;border-radius:3px;padding:2px 7px;white-space:nowrap}
.row .lead-cell.plainnum{background:none;border:none;color:var(--ink-mute);font-weight:400;padding:0;min-width:2.2em}
.row .name{font-size:16px;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.row .where{margin-top:3px;font-size:12.5px;color:var(--ink-mute)}
.row .where .dot{color:var(--rule);margin:0 6px}
.row .tail{display:flex;align-items:center;gap:12px;flex:none}
.row .chev{width:15px;height:15px;color:var(--rule);flex:none;transition:color .13s,transform .13s}
.row:hover .chev{color:var(--ink);transform:translateX(2px)}
@media (max-width:620px){
  .row{grid-template-columns:1fr auto;gap:0 10px;padding:14px 2px 14px 11px}
  .row .lead-cell{grid-column:1;grid-row:1;justify-self:start;margin-bottom:5px}
  .row .txt{grid-column:1;grid-row:2}
  .row .tail{grid-column:2;grid-row:1/3}
}

/* ══════════════════════════════════════════════════
   BIBLIOGRAFÍA (paso final)
   ══════════════════════════════════════════════════ */
.dl{margin-top:18px}
.dl .access svg{width:15px;height:15px}
.biblio{max-width:var(--col);margin:30px auto 0;padding:0 var(--pad)}
.biblio-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1.5px solid var(--ink)}
.biblio-h h3{font-size:15px;letter-spacing:.01em}

.item{padding:19px 0 19px 13px;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent}
.item:hover{border-left-color:var(--amber)}
.item h4{font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0;max-width:60em}
.item .det{margin-top:4px;font-size:14px;font-weight:400;color:var(--ink-soft);line-height:1.45;max-width:60em}
.item .acts{margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tag{font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);border:1px solid var(--rule);border-radius:3px;padding:2px 6px}
.access{
  display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;
  border:1px solid var(--ink);border-radius:var(--r);padding:7px 13px;font-size:13.5px;font-weight:700
}
.access:hover{background:var(--navy);border-color:var(--navy);color:#fff;text-decoration:none}
.access svg{width:13px;height:13px}
.access.alt{background:none;color:var(--ink)}
.access.alt:hover{background:var(--ink);color:#fff}

/* ══════════════════════════════════════════════════
   BÚSQUEDA: secciones y libros
   ══════════════════════════════════════════════════ */
.sect{max-width:var(--col);margin:34px auto 0;padding:0 var(--pad)}
.sect-h{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:1px solid var(--ink)}
.book{border-bottom:1px solid var(--rule-soft);padding:15px 4px 15px 13px;border-left:3px solid transparent}
.book:hover{border-left-color:var(--amber)}
.book .t{font-size:15.5px;font-weight:700;line-height:1.3}
.book .m{margin-top:3px;font-size:12.5px;color:var(--ink-mute)}
.book .u{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.ubtn{background:none;border:1px solid var(--rule);border-radius:3px;padding:3px 8px;font:400 11.5px var(--mono);color:var(--ink-soft)}
.ubtn:hover{border-color:var(--ink);color:var(--ink);background:var(--amber-wash)}

/* ══════════════════════════════════════════════════
   ESTADOS
   ══════════════════════════════════════════════════ */
.empty{max-width:560px;margin:0 auto;padding:64px var(--pad);text-align:center}
.empty h3{font-size:20px;margin-bottom:9px}
.empty p{color:var(--ink-soft);font-size:14.5px}
.empty .acts{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--r);padding:9px 16px;font-size:14px;font-weight:700}
.btn.alt{background:none;color:var(--ink)}
.btn:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.more{display:block;width:100%;max-width:var(--col);margin:22px auto 0;padding:13px;background:none;border:1px dashed var(--rule);border-radius:var(--r);color:var(--ink-soft);font-size:13.5px}
.more:hover{border-color:var(--ink);color:var(--ink)}

.boot{padding:90px var(--pad);text-align:center}
.boot .bar{height:3px;width:180px;margin:0 auto 15px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
.boot .bar i{display:block;height:100%;width:38%;background:var(--amber);animation:sl 1.05s infinite ease-in-out}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
.boot p{font:400 12px var(--mono);letter-spacing:.06em;color:var(--ink-mute)}

.foot{border-top:1px solid var(--rule);background:var(--wash)}
.foot-in{max-width:var(--col);margin:0 auto;padding:24px var(--pad) 38px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--ink-mute)}
.foot-in i{width:4px;height:15px;background:var(--amber);flex:none}
.foot-in .r{margin-left:auto;font:400 11px var(--mono)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .17s,transform .17s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top">
  <a href="?" id="home" class="bannerlink" aria-label="Inicio · Bibliografías, Bibliotecas Duoc UC">
    <img src="https://d2jv02qf7xgjwx.cloudfront.net/customers/8852/images/Banner_Portal.png"
         alt="Bibliotecas Duoc UC" class="banner">
  </a>
</header>


<section class="finder">
  <div class="finder-in">
    <div class="hero">
      <div class="hero-copy">
        <h1>Encuentra la bibliografía de tu <em>asignatura</em>.</h1>
      </div>
      <div class="searchbox">
        <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               aria-label="Buscar asignatura, código, carrera, autor o título"
               placeholder="Busca tu asignatura, código, carrera o libro…">
        <button class="clearq" id="clearq" aria-label="Limpiar búsqueda">✕</button>
      </div>
    </div>
  </div>
</section>

<nav class="steps" id="steps" aria-label="Ruta de navegación"><div class="steps-in" id="stepsIn"></div></nav>

<main id="main"></main>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<div class="boot" id="boot">
  <div class="bar"><i></i></div>
  <p id="bootMsg">Cargando bibliografías…</p>
</div>

<footer class="foot">
  <div class="foot-in">
    <i aria-hidden="true"></i>
    <span>Sistema de Bibliotecas · Duoc UC</span>
    <span class="r" id="dataInfo"></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═════════ 1. CONFIGURACIÓN ═════════ */
var CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSumFkJN4O1wxLJC1JHWZC7DG7c-cNA0rollmVKWtTigNMWf31AkSbjmse8t-YDg4N7tqDMrjxwVpqx/pub?gid=767463887&single=true&output=csv';
var CATALOG='https://bibliotecabuscador.duoc.cl/client/es_CL/default/search/results?qu=';
var PAGE=40;

/* ═════════ 2. UTILIDADES ═════════ */
var $=function(id){return document.getElementById(id);};
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}
function copy(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(msg);},function(){toast('No se pudo copiar');});
  }else toast('No se pudo copiar');
}
var CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
var OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

/* ═════════ 3. CSV ═════════ */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var rows=[],row=[],val='',inQ=false,i=0,n=text.length;
  while(i<n){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){val+='"';i+=2;continue;} inQ=false;i++;continue; }
      val+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(val);val='';i++;continue;}
    if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(val);rows.push(row);row=[];val='';i++;continue; }
    val+=c;i++;
  }
  if(val!==''||row.length){row.push(val);rows.push(row);}
  return rows;
}

/* ═════════ 4. LIMPIEZA DE DATOS ═════════ */
var PLACE_RE=/^[A-ZÁÉÍÓÚÑ][a-záéíóúñü\s]{1,18}[:,]\s*[A-ZÁÉÍÓÚÑ]/;
function tidyTitle(t){
  t=(t||'').trim().replace(/^[.,;:\s]+/,'');
  t=t.split(/\.\s*\(/)[0];
  t=t.replace(/\.\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñü]{2,18}\s*[,:].*$/,'');
  return t.replace(/[\s.,;:]+$/,'').trim();
}
function cleanTitle(title,ref){
  var t=tidyTitle(title);
  if(t.length>=4&&!PLACE_RE.test(t)) return t;
  var r=(ref||'').trim(), m=r.match(/\((\d{4}[a-z]?)\)\.?\s*/);
  if(m){
    var pre=r.slice(0,m.index).trim().replace(/[\s.,]+$/,'');
    var rest=tidyTitle(r.slice(m.index+m[0].length).split(/\.\s/)[0]);
    if(rest.length>=4&&!PLACE_RE.test(rest)) return rest;
    if(pre.length>=4) return pre;
  }
  return t||tidyTitle(r)||'Recurso sin título';
}
function cleanAsig(name,code){
  var s=(name||'').trim().replace(/\s*\(\s*[A-Za-z0-9._-]{3,12}\s*\)\s*$/,'').trim();
  return s||code||'Asignatura sin nombre';
}

/* ═════════ 5. MODELO JERÁRQUICO ═════════ */
var ESC=[], BOOKS=[], ASIG_IDX=[];
var escMap={}, carrMap={}, asigMap={}, bookMap={};

function build(matrix){
  var head=matrix[0].map(norm);
  function col(){
    for(var a=0;a<arguments.length;a++){var k=norm(arguments[a]);for(var i=0;i<head.length;i++) if(head[i]===k) return i;}
    for(var b=0;b<arguments.length;b++){var kk=norm(arguments[b]);for(var j=0;j<head.length;j++) if(head[j].indexOf(kk)===0) return j;}
    return -1;
  }
  var I={escuela:col('escuela'),plan:col('plan'),carrera:col('nombre carrera','carrera'),
    cod:col('cod asignatura','codigo asignatura'),asig:col('nombre asignatutas','nombre asignaturas','nombre asignatura'),
    proceso:col('proceso'),ref:col('referencia'),autor:col('autor'),
    anio:col('fecha publicacion','ano','anio'),titulo:col('titulo'),tipo:col('tipo recurso'),link:col('enlace recurso','enlace')};

  escMap={};carrMap={};asigMap={};bookMap={};ESC=[];BOOKS=[];ASIG_IDX=[];

  for(var r=1;r<matrix.length;r++){
    var c=matrix[r];
    if(!c||c.length<3) continue;
    var g=function(k){return I[k]>=0&&c[I[k]]!=null?String(c[I[k]]).trim():'';};
    var cod=g('cod').toUpperCase(), refTxt=g('ref');
    if(!cod&&!refTxt) continue;

    var eName=g('escuela')||'Sin escuela';
    var cName=g('carrera')||'Sin carrera';
    var plan=g('plan');
    var item={
      titulo:cleanTitle(g('titulo'),refTxt), autor:g('autor'), anio:g('anio'),
      tipo:(g('tipo').split('|')[0]||'Recurso').trim(), link:g('link'), ref:refTxt, plan:plan,
      proceso:g('proceso')||'Sin proceso'
    };

    /* escuela */
    var e=escMap[eName];
    if(!e){ e=escMap[eName]={name:eName,carreras:[],cmap:{}}; ESC.push(e); }
    /* carrera */
    var ck=eName+'§'+cName, cc=carrMap[ck];
    if(!cc){
      cc=carrMap[ck]={name:cName,escuela:eName,asigs:[],amap:{},planes:{},h:norm(cName+' '+eName)};
      e.carreras.push(cc); e.cmap[cName]=cc;
    }
    if(plan) cc.planes[plan]=1;
    /* asignatura */
    var ak=ck+'§'+cod, aa=asigMap[ak];
    if(!aa){
      aa=asigMap[ak]={cod:cod,name:'',escuela:eName,carrera:cName,planes:{},procesos:{},items:[],seen:{},key:ak};
      cc.asigs.push(aa); cc.amap[cod]=aa; ASIG_IDX.push(aa);
    }
    var nm=cleanAsig(g('asig'),cod);
    if(nm.length>aa.name.length) aa.name=nm;
    if(plan) aa.planes[plan]=1;
    aa.procesos[item.proceso]=1;

    var dk=norm(refTxt||item.titulo);
    if(!aa.seen[dk]){ aa.seen[dk]=1; aa.items.push(item); }

    /* índice de libros */
    var bk=dk, bb=bookMap[bk];
    if(!bb){ bb=bookMap[bk]={head:item,uses:[],useSeen:{},h:norm(item.titulo+' '+item.autor)}; BOOKS.push(bb); }
    var uk=aa.key;
    if(!bb.useSeen[uk]){ bb.useSeen[uk]=1; bb.uses.push(aa); }
  }

  /* orden y haystacks */
  ESC.sort(function(a,b){return a.name.localeCompare(b.name,'es');});
  ESC.forEach(function(e){
    e.carreras.sort(function(a,b){return a.name.localeCompare(b.name,'es');});
    e.carreras.forEach(function(cc){
      cc.asigs.sort(function(a,b){return a.name.localeCompare(b.name,'es')||a.cod.localeCompare(b.cod);});
      cc.asigs.forEach(function(aa){
        aa.items.sort(function(x,y){return (y.anio||'').localeCompare(x.anio||'')||x.titulo.localeCompare(y.titulo,'es');});
        aa.hCod=norm(aa.cod); aa.hName=norm(aa.name);
        aa.hAll=aa.hCod+' '+aa.hName+' '+norm(aa.carrera)+' '+norm(aa.escuela)+' '+Object.keys(aa.planes).join(' ');
      });
    });
  });
}

/* ═════════ 6. RUTA (URL + historial) ═════════ */
var R={q:'',e:'',c:'',a:'',plan:''};
function readRoute(){
  var p=new URLSearchParams(location.search);
  R={q:p.get('q')||'',e:p.get('escuela')||'',c:p.get('carrera')||'',a:p.get('asignatura')||'',plan:p.get('plan')||''};
  $('q').value=R.q;
}
function url(){
  var p=new URLSearchParams();
  if(R.q.trim()) p.set('q',R.q.trim());
  if(R.e) p.set('escuela',R.e);
  if(R.c) p.set('carrera',R.c);
  if(R.a) p.set('asignatura',R.a);
  if(R.plan) p.set('plan',R.plan);
  var s=p.toString();
  return s?location.pathname+'?'+s:location.pathname;
}
function go(patch,replace){
  Object.keys(patch).forEach(function(k){R[k]=patch[k];});
  if(replace) history.replaceState(null,'',url()); else history.pushState(null,'',url());
  paint();
  if(!replace) window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('popstate',function(){ readRoute(); paint(); });

/* ═════════ 7. BÚSQUEDA ═════════ */
function toks(q){return norm(q).split(/\s+/).filter(Boolean);}
function scoreAsig(a,t){
  var s=0;
  for(var i=0;i<t.length;i++){
    var k=t[i];
    if(a.hAll.indexOf(k)===-1) return -1;
    if(a.hCod===k) s+=1000; else if(a.hCod.indexOf(k)===0) s+=380;
    if(a.hName.indexOf(k)===0) s+=140; else if(a.hName.indexOf(k)>-1) s+=70;
    if(norm(a.carrera).indexOf(k)>-1) s+=25;
    if(norm(a.escuela).indexOf(k)>-1) s+=10;
  }
  return s;
}
function search(q){
  var t=toks(q), out={carreras:[],asigs:[],books:[]};
  if(!t.length) return out;

  var carr=[];
  for(var ck in carrMap){
    var cc=carrMap[ck], ok=true;
    for(var i=0;i<t.length;i++) if(cc.h.indexOf(t[i])===-1){ok=false;break;}
    if(ok) carr.push(cc);
  }
  carr.sort(function(a,b){return b.asigs.length-a.asigs.length||a.name.localeCompare(b.name,'es');});
  out.carreras=carr.slice(0,6);

  var as=[];
  for(var j=0;j<ASIG_IDX.length;j++){
    var s=scoreAsig(ASIG_IDX[j],t);
    if(s>=0) as.push({s:s,a:ASIG_IDX[j]});
  }
  as.sort(function(x,y){return y.s-x.s||x.a.name.localeCompare(y.a.name,'es');});
  out.asigs=as.map(function(o){return o.a;});

  var bk=[];
  for(var b=0;b<BOOKS.length;b++){
    var bb=BOOKS[b], all=true;
    for(var m=0;m<t.length;m++) if(bb.h.indexOf(t[m])===-1){all=false;break;}
    if(all) bk.push(bb);
  }
  bk.sort(function(a,b2){return b2.uses.length-a.uses.length||a.head.titulo.localeCompare(b2.head.titulo,'es');});
  out.books=bk.slice(0,8);
  return out;
}

/* ═════════ 8. COMPONENTES ═════════ */
function rowHTML(lead,name,where,attrs){
  return '<button class="row" '+attrs+'>'+
    (lead?'<span class="lead-cell">'+esc(lead)+'</span>':'<span></span>')+
    '<span class="txt"><span class="name">'+esc(name)+'</span>'+
      (where?'<span class="where">'+where+'</span>':'')+'</span>'+
    '<span class="tail">'+CHEV+'</span></button>';
}
function accessOf(it){
  if(it.link&&/^https?:\/\//i.test(it.link)) return {url:it.link,label:'Acceder al recurso',direct:true};
  return {url:CATALOG+encodeURIComponent(it.titulo),label:'Buscar en el catálogo',direct:false};
}
/* Extrae "Ciudad: Editorial" del final de la referencia APA */
function pubOf(ref){
  var m=(ref||'').match(/([A-ZÁÉÍÓÚÑ][^.:;]{1,40}:\s*[^.;]{2,60})\.?\s*$/);
  return m?m[1].replace(/\s+/g,' ').trim():'';
}
function detailOf(it){
  var d=[];
  if(it.autor) d.push(it.autor.replace(/[.,;\s]+$/,''));
  var p=pubOf(it.ref); if(p) d.push(p);
  if(it.anio) d.push(it.anio);
  return d.join(' · ');
}
function itemHTML(it){
  var A=accessOf(it), det=detailOf(it);
  return '<article class="item">'+
    '<h4>'+esc(it.titulo)+'</h4>'+
    (det?'<p class="det">'+esc(det)+'</p>':'')+
    '<div class="acts">'+
      '<a class="access'+(A.direct?'':' alt')+'" href="'+esc(A.url)+'" target="_blank" rel="noopener">'+A.label+OUT+'</a>'+
      '<span class="tag">'+esc(it.tipo)+'</span>'+
    '</div></article>';
}

/* ═════════ 9. PASOS ═════════ */
function steps(){
  var host=$('stepsIn'), inside=!!(R.e||R.q.trim());
  document.body.classList.toggle('inside',inside);
  if(!inside){ host.innerHTML=''; return; }

  var A = R.a && R.e && R.c ? asigMap[R.e+'§'+R.c+'§'+R.a] : null;
  var defs=[
    {k:'Escuela',   v:R.e||'Elegir',    on:!!R.e, target:{e:'',c:'',a:'',plan:'',q:''}, level:1},
    {k:'Carrera',   v:R.c||'Elegir',    on:!!R.c, target:{c:'',a:'',plan:'',q:''},      level:2},
    {k:'Asignatura',v:A?A.name:'Elegir',on:!!A,   target:{a:''},                        level:3}
  ];
  var current = R.q.trim()?0:(A?3:(R.c?2:(R.e?1:0)));

  /* Volver: sube exactamente un nivel, sin depender del historial */
  var up, upLbl;
  if(R.q.trim())      { up={q:''};                 upLbl = R.e ? 'Volver' : 'Volver al inicio'; }
  else if(A)          { up={a:''};                 upLbl = 'Volver a asignaturas'; }
  else if(R.c)        { up={c:'',a:'',plan:''};    upLbl = 'Volver a carreras'; }
  else                { up={e:'',c:'',a:'',plan:''};upLbl = 'Volver a escuelas'; }
  var html='<button class="back" id="backBtn">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'+
    esc(upLbl)+'</button>';

  if(R.q.trim()){
    html+='<button class="step now" disabled><span class="num">?</span><span class="lbl">'+
      '<span class="k">Búsqueda</span><span class="v">'+esc(R.q.trim())+'</span></span></button>';
  }
  defs.forEach(function(d,i){
    var isNow = !R.q.trim() && (i+1===current);
    var isDone = d.on && !isNow;
    var cls = isNow?'step now':(isDone?'step done':'step');
    var num = isDone?'✓':(i+1);
    html+='<button class="'+cls+'" '+(isDone?'data-back="'+i+'"':'disabled')+'>'+
      '<span class="num">'+num+'</span><span class="lbl">'+
      '<span class="k">'+d.k+'</span><span class="v">'+esc(d.v)+'</span></span></button>';
  });
  host.innerHTML=html;
  var bb=$('backBtn');
  if(bb) bb.onclick=function(){
    if(up.q!==undefined) $('q').value='';
    sift={carreras:'',asigs:'',escuelas:''};
    go(up);
  };
  host.querySelectorAll('[data-back]').forEach(function(b){
    b.onclick=function(){ go(defs[+b.dataset.back].target); };
  });
}

/* ═════════ 10. PANTALLAS ═════════ */
var sift={carreras:'',asigs:'',escuelas:''}, shown=PAGE;

function paint(){
  shown=PAGE;
  document.body.classList.toggle('has-q',!!R.q.trim());
  steps();
  var m=$('main'), say='', title='Bibliografías · Bibliotecas Duoc UC';
  if(R.q.trim()){
    m.innerHTML=viewSearch();
    var r=search(R.q);
    say='Resultados para '+R.q.trim()+'.';
    title='“'+R.q.trim()+'” · Bibliografías Duoc UC';
  }else if(R.a&&R.c&&R.e){
    m.innerHTML=viewAsig();
    var aa=asigMap[R.e+'§'+R.c+'§'+R.a];
    say= aa ? 'Bibliografía de '+aa.name+'.' : '';
    title= aa ? aa.cod+' '+aa.name+' · Bibliografías Duoc UC' : title;
  }else if(R.c&&R.e){
    m.innerHTML=viewCarrera();
    var cc=carrMap[R.e+'§'+R.c];
    say= cc ? 'Elige tu asignatura.' : '';
    title= cc ? cc.name+' · Bibliografías Duoc UC' : title;
  }else if(R.e){
    m.innerHTML=viewEscuela();
    var ee=escMap[R.e];
    say= ee ? 'Elige tu carrera.' : '';
    title= ee ? ee.name+' · Bibliografías Duoc UC' : title;
  }else{
    m.innerHTML=viewHome();
    say='Elige tu escuela.';
  }
  document.title=title;
  $('live').textContent=say;
  wire();
}

function iconOf(name){
  var n=norm(name);
  for(var i=0;i<ICONS.length;i++) if(ICONS[i][0].test(n)) return ICONS[i][1];
  return ICON_DEF;
}

function viewHome(){
  var h='<div class="head"><h2>Elige tu escuela</h2></div><div class="grid">';
  ESC.forEach(function(e){
    h+='<button class="tile" data-esc="'+esc(e.name)+'">'+
       '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="'+iconOf(e.name)+'"/></svg></span>'+
       '<span class="n">'+esc(e.name)+'</span>'+CHEV+'</button>';
  });
  return h+'</div>';
}

function viewEscuela(){
  var e=escMap[R.e];
  if(!e) return notFound('Esa escuela no está en la planilla.');
  var q=norm(sift.carreras);
  var list=e.carreras.filter(function(c){return !q||norm(c.name).indexOf(q)>-1;});
  var h='<div class="head"><span class="eyebrow">'+esc(e.name)+'</span>'+
    '<h2>Elige tu carrera</h2></div>'+
    '<div class="tools">'+siftHTML('carreras','Buscar carrera…')+'</div>';
  if(!list.length) return h+emptyBox('Ninguna carrera coincide con ese filtro.','carreras');
  h+='<div class="rows">';
  list.forEach(function(c){
    h+=rowHTML('',c.name,'','data-carr="'+esc(c.name)+'"');
  });
  return h+'</div>';
}

function viewCarrera(){
  var c=carrMap[R.e+'§'+R.c];
  if(!c) return notFound('Esa carrera no está en la planilla.');
  var planes=Object.keys(c.planes).sort();
  var q=norm(sift.asigs);
  var list=c.asigs.filter(function(a){
    if(R.plan&&!a.planes[R.plan]) return false;
    if(!q) return true;
    return norm(a.name).indexOf(q)>-1||a.hCod.indexOf(q)>-1;
  });
  var h='<div class="head"><span class="eyebrow">'+esc(c.name)+'</span>'+
    '<h2>Elige tu asignatura</h2></div>'+
    '<div class="tools">'+siftHTML('asigs','Buscar por nombre o código…');

    h+='<div class="planbar" role="group" aria-label="Filtrar por plan de estudio">'+
      '<button class="plan-chip" data-plan="" aria-pressed="'+(!R.plan)+'">Todos los planes</button>';

  }

function viewSearch(){
  var res=search(R.q);
  var total=res.carreras.length+res.asigs.length+res.books.length;
  if(!total){
    return '<div class="empty"><h3>Sin resultados para “'+esc(R.q.trim())+'”</h3>'+
      '<p>Prueba con el código exacto de la asignatura, con menos palabras, o navega por escuela.</p>'+
      '<div class="acts"><button class="btn" data-clear="1">Ver todas las escuelas</button></div></div>';
  }
  var h='<div class="head"><span class="eyebrow">Resultados</span>'+
    '<h2>“'+esc(R.q.trim())+'”</h2></div>';

  if(res.carreras.length){
    h+='<div class="sect"><div class="sect-h"><span class="eyebrow">Carreras</span></div></div>';
    h+='<div class="rows">';
    res.carreras.forEach(function(c){
      h+=rowHTML('',c.name,esc(c.escuela),'data-goto-carr="'+esc(c.escuela)+'§'+esc(c.name)+'"');
    });
    h+='</div>';
  }
  if(res.asigs.length){
    h+='<div class="sect"><div class="sect-h"><span class="eyebrow">Asignaturas</span></div></div>';
    h+='<div class="rows">';
    res.asigs.slice(0,shown).forEach(function(a){
      h+=rowHTML(a.cod,a.name,esc(a.carrera)+'<span class="dot">·</span>'+esc(a.escuela),
        'data-goto-asig="'+esc(a.key)+'"');
    });
    h+='</div>';
    if(res.asigs.length>shown) h+='<button class="more" data-more="1">Mostrar más</button>';
  }
  if(res.books.length){
    h+='<div class="sect"><div class="sect-h"><span class="eyebrow">Libros y otros recursos</span></div>';
    res.books.forEach(function(b){
      var A=accessOf(b.head);
      h+='<div class="book"><p class="t">'+esc(b.head.titulo)+'</p>'+
        '<p class="m">'+esc(b.head.autor||'Autor no registrado')+' · '+esc(b.head.anio||'s.f.')+' · '+esc(b.head.tipo)+
        ' · <a href="'+esc(A.url)+'" target="_blank" rel="noopener">'+A.label+'</a></p>'+
        '<div class="u">';
      b.uses.slice(0,8).forEach(function(a){
        h+='<button class="ubtn" data-goto-asig="'+esc(a.key)+'">'+esc(a.cod)+' · '+esc(a.name)+'</button>';
      });
      h+='</div></div>';
    });
    h+='</div>';
  }
  return h;
}

/* ═════════ 11. EVENTOS DE PANTALLA ═════════ */
function wire(){
  var m=$('main');
  m.querySelectorAll('[data-esc]').forEach(function(b){
    b.onclick=function(){ sift.carreras=''; go({e:b.dataset.esc,c:'',a:'',plan:'',q:''}); };
  });
  m.querySelectorAll('[data-carr]').forEach(function(b){
    b.onclick=function(){ sift.asigs=''; go({c:b.dataset.carr,a:'',plan:'',q:''}); };
  });
  m.querySelectorAll('[data-asig]').forEach(function(b){
    b.onclick=function(){ go({a:b.dataset.asig,q:''}); };
  });
  m.querySelectorAll('[data-goto-carr]').forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.gotoCarr.split('§');
      sift.asigs=''; $('q').value='';
      go({q:'',e:p[0],c:p[1],a:'',plan:''});
    };
  });
  m.querySelectorAll('[data-goto-asig]').forEach(function(b){
    b.onclick=function(){
      var p=b.dataset.gotoAsig.split('§');
      $('q').value='';
      go({q:'',e:p[0],c:p[1],a:p[2],plan:''});
    };
  });
  m.querySelectorAll('[data-plan]').forEach(function(b){
    b.onclick=function(){ go({plan:b.dataset.plan},true); };
  });
  m.querySelectorAll('[data-more]').forEach(function(b){
    b.onclick=function(){
      var y=window.scrollY; shown+=PAGE;
      var mm=$('main');
      if(R.q.trim()) mm.innerHTML=viewSearch(); else mm.innerHTML=viewCarrera();
      wire(); window.scrollTo({top:y,behavior:'auto'});
    };
  });
  m.querySelectorAll('[data-clear]').forEach(function(b){
    b.onclick=function(){ $('q').value=''; sift={carreras:'',asigs:'',escuelas:''}; go({q:'',e:'',c:'',a:'',plan:''}); };
  });
  m.querySelectorAll('[data-sift-clear]').forEach(function(b){
    b.onclick=function(){ sift[b.dataset.siftClear]=''; paint(); };
  });
  m.querySelectorAll('[data-sift]').forEach(function(inp){
    inp.oninput=function(){
      var k=inp.dataset.sift, pos=inp.selectionStart;
      sift[k]=inp.value; shown=PAGE;
      var mm=$('main');
      mm.innerHTML = R.e&&R.c ? viewCarrera() : viewEscuela();
      wire();
      var again=$('main').querySelector('[data-sift="'+k+'"]');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
    };
  });
  m.querySelectorAll('[data-pdf]').forEach(function(b){
    b.onclick=function(){
      var a=asigMap[R.e+'§'+R.c+'§'+R.a];
      if(a) makePDF(a,b);
    };
  });
}

/* ═════════ DESCARGA EN PDF ═════════ */
var PDF_SRC=[
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
];
function loadScript(src){
  return new Promise(function(res,rej){
    var t=document.createElement('script');
    t.src=src; t.async=true;
    t.onload=function(){ res(); };
    t.onerror=function(){ rej(new Error('no se pudo cargar '+src)); };
    document.head.appendChild(t);
  });
}
function ensurePDF(){
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf);
  var p=Promise.reject();
  PDF_SRC.forEach(function(src){
    p=p.catch(function(){
      return loadScript(src).then(function(){
        if(!(window.jspdf&&window.jspdf.jsPDF)) throw new Error('librería incompleta');
        return window.jspdf;
      });
    });
  });
  return p;
}
/* jsPDF usa fuentes con codificación latina: se normalizan comillas y guiones tipográficos */
function pdfSafe(s){
  return (s||'').replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'")
                .replace(/[–—]/g,'-').replace(/\u00a0/g,' ');
}
function fileName(a){
  var base=('Bibliografia_'+a.cod+'_'+a.name).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'_').replace(/_+$/,'').slice(0,80);
  return base+'.pdf';
}
function makePDF(a,btn){
  var prev=btn.innerHTML;
  btn.disabled=true; btn.textContent='Generando PDF…';
  ensurePDF().then(function(ns){
    var doc=new ns.jsPDF({unit:'pt',format:'a4'});
    var W=595, M=48, RIGHT=W-M, y=0;
    var planes=Object.keys(a.planes).sort().join(' · ');
    var stamp=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});

    function footer(){
      var pg=doc.internal.getCurrentPageInfo().pageNumber;
      doc.setDrawColor(226); doc.setLineWidth(.5); doc.line(M,800,RIGHT,800);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(130);
      doc.text('Bibliotecas Duoc UC · Descargado el '+stamp,M,812);
      doc.text(String(pg),RIGHT,812,{align:'right'});
    }
    function band(){
      doc.setFillColor(245,168,0); doc.rect(0,0,W,7,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(120);
      doc.text('BIBLIOTECAS DUOC UC',M,32);
    }
    function room(need){
      if(y+need<=786) return;
      footer(); doc.addPage(); band(); y=58;
    }

    /* portada de la ficha */
    band(); y=58;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
    doc.text('BIBLIOGRAFÍA DE ASIGNATURA',M,y); y+=22;
    doc.setFontSize(19);
    doc.splitTextToSize(pdfSafe(a.name),RIGHT-M).forEach(function(l){ doc.text(l,M,y); y+=23; });
    y+=2;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(70);
    [['Código',a.cod],['Carrera',a.carrera],['Escuela',a.escuela],
     [planes.indexOf('·')>-1?'Planes':'Plan',planes||'—'],
     ['Proceso',Object.keys(a.procesos).join(' · ')]].forEach(function(r){
      if(!r[1]) return;
      doc.setFont('helvetica','bold'); doc.text(r[0]+':',M,y);
      doc.setFont('helvetica','normal');
      doc.splitTextToSize(pdfSafe(r[1]),RIGHT-M-58).forEach(function(l,i){
        doc.text(l,M+58,y+i*13);
      });
      y+=13*Math.max(1,doc.splitTextToSize(pdfSafe(r[1]),RIGHT-M-58).length);
    });
    y+=10;
    doc.setDrawColor(16); doc.setLineWidth(1); doc.line(M,y,RIGHT,y); y+=8;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
    doc.text('MATERIAL DE LA ASIGNATURA',M,y+14); y+=36;

    /* recursos */
    a.items.forEach(function(it,i){
      var A=accessOf(it);
      var title=doc.splitTextToSize((i+1)+'. '+pdfSafe(it.titulo),RIGHT-M-14);
      var det=pdfSafe(detailOf(it));
      var detL=det?doc.splitTextToSize(det,RIGHT-M-14):[];
      var urlL=doc.splitTextToSize(A.url,RIGHT-M-14);
      room(title.length*13+detL.length*12+urlL.length*10+30);

      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(16);
      title.forEach(function(l){ doc.text(l,M,y); y+=13; });
      if(detL.length){
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(85);
        detL.forEach(function(l){ doc.text(l,M+14,y); y+=12; });
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
      doc.text(pdfSafe(it.tipo)+' · '+(A.direct?'Acceso directo':'Búsqueda en catálogo'),M+14,y); y+=11;
      doc.setFontSize(8.5); doc.setTextColor(0,33,71);
      urlL.forEach(function(l){ doc.textWithLink(l,M+14,y,{url:A.url}); y+=10; });
      y+=12;
      doc.setDrawColor(239); doc.setLineWidth(.5); doc.line(M,y-6,RIGHT,y-6);
    });
    footer();
    doc.save(fileName(a));
    btn.disabled=false; btn.innerHTML=prev;
  }).catch(function(err){
    if(window.console&&console.warn) console.warn('PDF:',err&&err.message?err.message:err);
    printFallback(a);
    btn.disabled=false; btn.innerHTML=prev;
  });
}
/* Si no hay red para la librería: vista de impresión (Guardar como PDF) */
function printFallback(a){
  var w=window.open('','_blank');
  if(!w){ toast('Permite las ventanas emergentes para descargar el PDF.'); return; }
  var planes=Object.keys(a.planes).sort().join(' · ');
  var rows=a.items.map(function(it,i){
    var A=accessOf(it), det=detailOf(it);
    return '<li><p class="t">'+esc(it.titulo)+'</p>'+
      (det?'<p class="d">'+esc(det)+'</p>':'')+
      '<p class="l">'+esc(it.tipo)+' · <a href="'+esc(A.url)+'">'+esc(A.url)+'</a></p></li>';
  }).join('');
  w.document.write('<!DOCTYPE html><html lang="es-CL"><head><meta charset="utf-8">'+
    '<title>'+esc(fileName(a).replace(/\.pdf$/,''))+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">'+
    '<style>body{font:400 11pt/1.5 Lato,sans-serif;color:#111;margin:34px}'+
    'hr{border:none;border-top:1px solid #111;margin:14px 0}'+
    '.band{height:6px;background:#F5A800;margin-bottom:18px}'+
    'h1{font-size:19pt;margin:.2em 0 .5em}.k{font-size:8pt;letter-spacing:.14em;color:#777}'+
    '.m{font-size:10pt;color:#444}.m b{color:#111}ol{padding-left:18px}'+
    'li{margin-bottom:14px;break-inside:avoid}.t{font-weight:700;margin:0}'+
    '.d{margin:2px 0 0;color:#555}.l{margin:4px 0 0;font-size:9pt}'+
    'a{color:#002147}@media print{a{text-decoration:underline}}</style></head><body>'+
    '<div class="band"></div><p class="k">BIBLIOTECAS DUOC UC · BIBLIOGRAFÍA DE ASIGNATURA</p>'+
    '<h1>'+esc(a.name)+'</h1><p class="m"><b>Código:</b> '+esc(a.cod)+
    ' &nbsp;·&nbsp; <b>Carrera:</b> '+esc(a.carrera)+' &nbsp;·&nbsp; <b>Escuela:</b> '+esc(a.escuela)+
    (planes?' &nbsp;·&nbsp; <b>Plan:</b> '+esc(planes):'')+'</p><hr><ol>'+rows+'</ol>'+
    '<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script>'+
    '</body></html>');
  w.document.close();
  toast('Se abrió la vista de impresión: usa “Guardar como PDF”.');
}

/* ═════════ CARGA ═════════ */
var BOOT=$('boot').innerHTML;
function load(force){
  $('boot').innerHTML=BOOT; $('boot').style.display=''; $('main').style.display='none';
  var u=CSV_URL+(force?'&_='+Date.now():'');
  fetch(u,{cache:force?'reload':'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(start)
    .catch(fail);
}
function start(txt){
  var m=parseCSV(txt);
  if(m.length<2) throw new Error('La planilla llegó vacía.');
  build(m);
  if(!ASIG_IDX.length) throw new Error('No se reconocieron columnas de bibliografía.');
  $('boot').style.display='none'; $('main').style.display='';
  $('dataInfo').textContent='Datos leídos '+
    new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  readRoute(); paint();
}
function fail(err){
  $('boot').innerHTML='<div class="empty"><h3>No se pudieron cargar los datos</h3>'+
    '<p>La planilla publicada no respondió ('+esc(err.message)+'). Verifica que siga publicada como CSV en '+
    '<em>Archivo → Compartir → Publicar en la web</em>, o carga el archivo desde tu equipo.</p>'+
    '<div class="acts"><button class="btn" id="retry">Reintentar</button>'+
    '<label class="btn alt" for="fileIn">Cargar CSV</label>'+
    '<input id="fileIn" type="file" accept=".csv,text/csv" class="sr"></div></div>';
  $('retry').onclick=function(){ load(true); };
  $('fileIn').onchange=function(ev){
    var f=ev.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ try{ start(rd.result); }catch(e){ toast('No se pudo leer ese archivo.'); } };
    rd.readAsText(f,'utf-8');
  };
}
load(false);
})();
